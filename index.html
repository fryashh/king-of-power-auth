<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KING OF POWER Auth</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cyan: #00E5FF;
            --navy: #070B14;
            --glass-bg: rgba(7, 11, 20, 0.6);
        }

        /* STRICT ANDROID FIXES */
        body, html {
            width: 100vw; height: 100vh; overflow: hidden; margin: 0; padding: 0;
            background-color: var(--navy);
            font-family: 'Inter', sans-serif;
            color: #fff;
            overscroll-behavior: none; /* Stops pull-to-refresh */
            -webkit-tap-highlight-color: transparent; /* Removes touch blue tap highlight */
        }

        #app-container {
            width: 100vw; height: 100vh;
            position: relative; display: flex; flex-direction: column; overflow: hidden;
        }

        #bg-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
            will-change: transform; /* Hardware acceleration for canvas */
            transform: translateZ(0);
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            /* Transform optimizations for 3D tilt and lag reduction */
            will-change: transform;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        .tilt-card {
            /* Applied via JS for 3D effect */
            transform: perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1);
        }

        .tech-input {
            width: 100%; background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 229, 255, 0.3);
            color: var(--cyan); border-radius: 12px;
            padding: 14px 14px 14px 44px; font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s ease; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .tech-input:focus {
            outline: none; border-color: var(--cyan);
            background: rgba(0, 229, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2), inset 0 0 10px rgba(0,0,0,0.5);
        }
        .tech-input option { background-color: var(--navy); color: #fff; }

        .btn-primary {
            background: linear-gradient(135deg, #00E5FF 0%, #0088FF 100%);
            color: #000; font-weight: 800; border-radius: 12px;
            padding: 14px; width: 100%; font-size: 14px;
            text-transform: uppercase; letter-spacing: 1px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
            transition: transform 0.1s, filter 0.2s;
        }
        .btn-primary:active { transform: scale(0.96); filter: brightness(1.2); }
        .btn-primary:disabled { opacity: 0.6; pointer-events: none; }

        /* Screens & Navigation */
        .screen { position: absolute; inset: 0; display: flex; flex-direction: column; transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10; }
        .hidden-screen { opacity: 0; pointer-events: none; transform: scale(0.95); }
        .active-screen { opacity: 1; pointer-events: auto; transform: scale(1); }
        
        .tab-panel { display: none; animation: slideUp 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .tab-panel.active-tab { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .bottom-nav {
            background: rgba(7, 11, 20, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 229, 255, 0.2);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .nav-item { color: rgba(255,255,255,0.3); transition: all 0.3s; position: relative; }
        .nav-item.active { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); transform: translateY(-3px); }
        
        /* Stats Rings */
        .ring-bg { fill: none; stroke: rgba(0,229,255,0.1); stroke-width: 6; }
        .ring-prog { fill: none; stroke: var(--cyan); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1); transform: rotate(-90deg); transform-origin: 50% 50%; filter: drop-shadow(0 0 5px var(--cyan)); }

        .terminal-text { font-family: 'JetBrains Mono', monospace; color: var(--cyan); font-size: 12px; text-shadow: 0 0 5px var(--cyan); }
        .cyber-loader { border: 3px solid rgba(0,229,255,0.2); border-top-color: var(--cyan); border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.5); border-radius: 4px; }
    </style>
</head>
<body>

    <div id="app-container">
        <canvas id="bg-canvas"></canvas>

        <div id="toast-wrapper" class="absolute top-10 left-0 w-full px-4 z-[100] flex flex-col gap-2 pointer-events-none"></div>

            <div class="glass-panel tilt-card p-6 w-full max-w-sm mx-auto flex flex-col items-center">
                
                <!-- Exact Requested Logo Tag -->
                <img src='logo.png' alt='Logo' style='width:120px;height:120px;object-fit:cover;border-radius:50%;border:2px solid #00E5FF;box-shadow:0 0 20px #00E5FF;margin:0 auto 20px auto;display:block;'>
                
                <h1 class="text-2xl font-black text-white tracking-widest uppercase mb-1 drop-shadow-[0_0_10px_rgba(0,229,255,0.5)]">King of Power</h1>
                <p class="text-[10px] text-cyan-400 font-mono tracking-[0.3em] mb-8">SECURE_AUTH_NODE</p>

                <div class="w-full space-y-5">

                    </div>
                    
                    <button onclick="handleLogin()" id="btn-login" class="btn-primary mt-4">

                    </button>

            </div>
        </div>

        <div id="screen-boot" class="screen hidden-screen bg-black z-40 p-4 flex flex-col justify-end">
            <div id="terminal-content" class="terminal-text space-y-2 mb-24 opacity-90"></div>
        </div>

        <div id="screen-main" class="screen hidden-screen z-30 flex flex-col h-full">
            
            <header class="pt-12 pb-4 px-5 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent z-20 shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl border border-cyan-400 bg-cyan-900/40 flex items-center justify-center shadow-[0_0_15px_rgba(0,229,255,0.4)]">
                        <i class="fas fa-crown text-cyan-400 text-lg"></i>
                    </div>
                    <div>
                        <h2 class="text-sm font-black text-white tracking-widest uppercase">Admin Panel</h2>
                        <div class="flex items-center gap-1.5 mt-0.5">
                            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse shadow-[0_0_8px_#4ade80]"></span>
                            <span class="text-[9px] text-cyan-400 font-mono tracking-widest">SYSTEM ONLINE</span>
                        </div>
                    </div>
                </div>
                <button id="btn-sound" onclick="toggleSound()" class="text-cyan-400 p-2 text-xl hover:scale-110 transition-transform">
                    <i class="fas fa-volume-up"></i>
                </button>
            </header>

            <main class="flex-1 overflow-y-auto px-4 pt-2 pb-24 relative z-10" id="main-scroll">
                
                <div id="tab-dashboard" class="tab-panel active-tab">
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="glass-panel tilt-card p-5 flex flex-col items-center relative text-center">
                            <div class="relative w-20 h-20 mb-3 flex justify-center items-center">
                                <svg class="absolute inset-0 w-full h-full drop-shadow-lg" viewBox="0 0 80 80">
                                    <circle cx="40" cy="40" r="34" class="ring-bg"></circle>
                                    <circle id="ring-users" cx="40" cy="40" r="34" class="ring-prog" stroke-dasharray="213.6" stroke-dashoffset="213.6"></circle>
                                </svg>
                                <i class="fas fa-users text-cyan-400 text-2xl absolute"></i>
                            </div>

                            <p class="text-[9px] text-cyan-400 font-bold uppercase tracking-widest mt-1">Total Users</p>
                        </div>
                        
                        <div class="glass-panel tilt-card p-5 flex flex-col items-center relative text-center">
                            <div class="relative w-20 h-20 mb-3 flex justify-center items-center">
                                <svg class="absolute inset-0 w-full h-full drop-shadow-lg" viewBox="0 0 80 80">
                                    <circle cx="40" cy="40" r="34" class="ring-bg"></circle>

                <div id="tab-keys" class="tab-panel">

                            <i class="fas fa-microchip"></i>
                        </div>
                        <h3 class="text-[12px] font-black text-cyan-400 mb-5 uppercase tracking-[0.2em] flex items-center gap-2">
                            <i class="fas fa-bolt"></i> License Generator
                        </h3>
                        
                        <div class="space-y-4 relative z-10">
                            <div>
                                <label class="block text-[9px] font-bold text-gray-400 mb-1.5 uppercase tracking-widest">Step 1: Select Panel</label>
                                <select id="sel-panel" class="tech-input !p-3.5 !bg-black/60">
                                    <option value="AIMBOT">AIMBOT</option>
                                    <option value="BRUTAL">BRUTAL</option>
                                </select>

                                <select id="sel-duration" class="tech-input !p-3.5 !bg-black/60">

                <div id="tab-network" class="tab-panel">
                    <div class="glass-panel tilt-card p-5 mb-5 relative">
                        <div class="flex justify-between items-end mb-3 border-b border-cyan-500/20 pb-2">
                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest"><i class="fas fa-satellite-dish mr-1"></i> Server Latency</span>
                            <span class="text-xs font-mono font-bold text-cyan-400 drop-shadow-[0_0_5px_#00E5FF]" id="ping-text">35ms</span>
                        </div>
                        <div class="w-full h-24 bg-black/60 rounded-xl border border-cyan-500/30 overflow-hidden relative inset-shadow-sm">
                            <!-- Graph grid lines -->
                            <div class="absolute inset-0 bg-[linear-gradient(rgba(0,229,255,0.1)_1px,transparent_1px),linear-gradient(90deg,rgba(0,229,255,0.1)_1px,transparent_1px)] bg-[size:10px_10px]"></div>
                            <canvas id="ping-canvas" class="absolute inset-0 w-full h-full"></canvas>
                        </div>
                    </div>

                    <div class="glass-panel p-4">
                        <h3 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3 border-b border-cyan-500/20 pb-2"><i class="fas fa-exchange-alt mr-1"></i> Live API Traffic</h3>
                        <div id="api-log-list" class="font-mono text-[10px] leading-relaxed space-y-1.5 h-[180px] overflow-y-auto bg-black/50 p-2 rounded-lg border border-gray-800">

            </main>

            <nav class="absolute bottom-0 left-0 w-full h-[75px] bottom-nav flex justify-around items-center z-50 shrink-0 shadow-[0_-5px_20px_rgba(0,0,0,0.5)]">
                <button onclick="switchTab('dashboard', this)" class="nav-item active flex-1 h-full flex flex-col justify-center items-center gap-1.5">
                    <i class="fas fa-chart-line text-xl"></i>
                    <span class="text-[9px] font-bold tracking-widest uppercase">Dash</span>

                <button onclick="switchTab('keys', this)" class="nav-item flex-1 h-full flex flex-col justify-center items-center gap-1.5">

                </button>
                <button onclick="switchTab('network', this)" class="nav-item flex-1 h-full flex flex-col justify-center items-center gap-1.5">

    </div>

    <script>
        const state = {
            users: 0,
            activeKeys: 0,
            soundEnabled: true,
            apiInterval: null,
            pingInterval: null,
            pingData: Array(30).fill(35),
            maxRing: 50 // Ring reaches full stroke at 50 units
        };

        // --- Web Audio API Engine ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!state.soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(1300, now + 0.05);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'success') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.03, now + 0.05);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.25);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            }
        }

        function toggleSound() {
            state.soundEnabled = !state.soundEnabled;
            const btn = document.getElementById('btn-sound');
            if (state.soundEnabled) {
                btn.innerHTML = '<i class="fas fa-volume-up"></i>';
                playSound('click');
            } else {
                btn.innerHTML = '<i class="fas fa-volume-mute text-gray-500"></i>';
            }
        }

        // --- Optimized Canvas Background ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        const particles = [];
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.fillStyle = '#070B14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Limiting to 30 particles for Android 60fps performance
        for (let i = 0; i < 30; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.6,
                vy: (Math.random() - 0.5) * 0.6,
                r: Math.random() * 2 + 0.5
            });
        }

        function animateCanvas() {
            ctx.fillStyle = '#070B14'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'rgba(0, 229, 255, 0.8)';
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx = -p.vx;
                if (p.y < 0 || p.y > canvas.height) p.vy = -p.vy;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    // Fast distance check optimization
                    let dx = p.x - p2.x;
                    let dy = p.y - p2.y;
                    if(Math.abs(dx) < 120 && Math.abs(dy) < 120) {
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(0, 229, 255, ${0.2 - dist/600})`;
                            ctx.lineWidth = 1;
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                }
            }
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // --- 3D Tilt Effect ---
        function applyTilt() {
            const cards = document.querySelectorAll('.tilt-card');
            cards.forEach(el => {
                el.addEventListener('mousemove', e => {
                    const rect = el.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const xPct = (x / rect.width) - 0.5;
                    const yPct = (y / rect.height) - 0.5;
                    // Max tilt 12 degrees
                    el.style.transform = `perspective(1000px) rotateY(${xPct * 12}deg) rotateX(${-yPct * 12}deg) scale3d(1.02, 1.02, 1.02)`;
                });
                el.addEventListener('mouseleave', () => {
                    el.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg) scale3d(1, 1, 1)`;
                });
            });
        }
        applyTilt();

        // --- UI & Logic Methods ---
        function showToast(msg, isError = false) {
            const wrapper = document.getElementById('toast-wrapper');
            const toast = document.createElement('div');
            const bg = isError ? 'bg-red-900/90 border-red-500 text-red-100 shadow-[0_0_15px_rgba(239,68,68,0.5)]' : 'bg-cyan-900/90 border-cyan-500 text-cyan-100 shadow-[0_0_15px_rgba(0,229,255,0.5)]';
            
            toast.className = `p-4 rounded-xl border flex items-center gap-3 font-mono text-[11px] uppercase transition-all duration-300 transform translate-y-[-20px] opacity-0 backdrop-blur-md ${bg}`;
            toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'} text-lg"></i> <span>${msg}</span>`;
            
            wrapper.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.style.transform = 'translateY(0)';
                toast.style.opacity = '1';
            });
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function updateRing(id, val) {
            const el = document.getElementById(id);
            if(el) {
                const prog = Math.min(val / state.maxRing, 1);
                el.style.strokeDashoffset = 213.6 - (prog * 213.6);
            }
        }

        function handleLogin() {
            playSound('click');
            const user = document.getElementById('inp-user').value.trim();
            const pass = document.getElementById('inp-pass').value;
            const btn = document.getElementById('btn-login');

            btn.innerHTML = '<div class="cyber-loader"></div>';
            btn.disabled = true;

            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-power-off"></i> <span>Initialize</span>';
                
                // EXACT login match required
                const valid1 = (user === 'Nivassadadiya@gmail.com' && pass === 'Nivas^100%ex97059705');
                const valid2 = (user === 'YASH' && pass === 'YASH');

                if (valid1 || valid2) {
                    playSound('success');
                    startBoot();
                } else {
                    playSound('error');
                    // EXACT toast requirement
                    showToast('wrong pass or user entered', true);
                }
            }, 800);
        }

        function startBoot() {
            document.getElementById('screen-login').classList.replace('active-screen', 'hidden-screen');
            document.getElementById('screen-boot').classList.replace('hidden-screen', 'active-screen');
            
            const term = document.getElementById('terminal-content');
            const lines = [
                "ESTABLISHING SECURE HANDSHAKE...",
                "BYPASSING FIREWALL... [SUCCESS]",
                "DECRYPTING PAYLOAD...",
                "LOADING KING OF POWER MODULES...",
                "ACCESS GRANTED. WELCOME ADMIN."
            ];
            
            term.innerHTML = '';
            let idx = 0;
            
            function type() {
                if (idx < lines.length) {
                    playSound('click');
                    term.innerHTML += `<div>> ${lines[idx]}</div>`;
                    idx++;
                    setTimeout(type, 200 + Math.random() * 150);
                } else {
                    setTimeout(() => {
                        document.getElementById('screen-boot').classList.replace('active-screen', 'hidden-screen');
                        document.getElementById('screen-main').classList.replace('hidden-screen', 'active-screen');
                        playSound('success');
                        updateRing('ring-users', state.users);
                        updateRing('ring-keys', state.activeKeys);
                        startNetwork();
                    }, 500);
                }
            }
            type();
        }

        function switchTab(id, btn) {
            playSound('click');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            
            document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active-tab'));
            document.getElementById('tab-' + id).classList.add('active-tab');
        }

        function handleGenerate() {
            const panel = document.getElementById('sel-panel').value;
            const duration = document.getElementById('sel-duration').value;
            const keyInput = document.getElementById('inp-gen-key');
            const keyVal = keyInput.value.trim();
            const btn = document.getElementById('btn-generate');

            // STRICT Check for Admin Gen Key
            if (keyVal !== 'YASH2007') {
                playSound('error');
                showToast('Invalid Admin Generation Key', true);
                return;
            }

            playSound('click');
            btn.innerHTML = '<div class="cyber-loader"></div> <span class="ml-2 font-mono">PROCESSING...</span>';
            btn.disabled = true;

            // 1.5s loading animation requirement
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-fingerprint text-lg mr-1"></i> Generate License';
                keyInput.value = '';
                playSound('success');
                
                state.activeKeys++;
                if(Math.random() > 0.4) state.users++; 
                
                document.getElementById('stat-keys').innerText = state.activeKeys;
                document.getElementById('stat-users').innerText = state.users;
                updateRing('ring-keys', state.activeKeys);
                updateRing('ring-users', state.users);
                
                const randKey = 'KOP-' + Array.from({length:12}, () => Math.random().toString(36)[2]).join('').toUpperCase();
                const list = document.getElementById('key-output-list');
                if (document.getElementById('empty-keys')) document.getElementById('empty-keys').remove();
                
                const html = `
                    <div class="bg-cyan-900/30 border border-cyan-500/40 p-3 rounded-lg flex justify-between items-center mb-2 shadow-[inset_0_0_10px_rgba(0,229,255,0.1)]">
                        <div>
                            <div class="text-xs font-mono font-bold text-white drop-shadow-[0_0_5px_rgba(255,255,255,0.5)]">${randKey}</div>
                            <div class="flex gap-2 mt-1.5 text-[9px] font-black text-cyan-400/80">
                                <span class="bg-black/50 px-1.5 py-0.5 rounded border border-cyan-500/20"><i class="fas fa-crosshairs mr-1"></i>${panel}</span> 
                                <span class="bg-black/50 px-1.5 py-0.5 rounded border border-cyan-500/20"><i class="far fa-clock mr-1"></i>${duration}</span>
                            </div>
                        </div>
                        <button onclick="navigator.clipboard.writeText('${randKey}'); showToast('COPIED TO CLIPBOARD'); playSound('click');" class="text-cyan-400 bg-black/40 hover:bg-cyan-900/50 p-2 rounded-lg border border-cyan-500/30 transition-colors">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                `;
                list.insertAdjacentHTML('afterbegin', html);
                showToast('LICENSE GENERATED');
            }, 1500);
        }

        function startNetwork() {
            if (state.pingInterval) return; // Prevent multiple intervals

            const canvas = document.getElementById('ping-canvas');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
            }
            resize(); 

            state.pingInterval = setInterval(() => {
                let p = state.pingData[state.pingData.length - 1] + (Math.floor(Math.random() * 15) - 7);
                p = Math.max(15, Math.min(150, p));
                state.pingData.shift(); state.pingData.push(p);
                
                const pingText = document.getElementById('ping-text');
                pingText.innerText = p + 'ms';
                pingText.className = `text-xs font-mono font-bold drop-shadow-[0_0_5px_#00E5FF] ${p > 100 ? 'text-red-400' : p > 70 ? 'text-yellow-400' : 'text-cyan-400'}`;
                
                ctx.clearRect(0,0, canvas.width, canvas.height);
                
                // Draw graph fill
                ctx.beginPath();
                const step = canvas.width / (state.pingData.length - 1);
                ctx.moveTo(0, canvas.height);
                for(let i=0; i<state.pingData.length; i++) {
                    const x = i * step;
                    const y = canvas.height - ((state.pingData[i] / 180) * canvas.height);
                    ctx.lineTo(x,y);
                }
                ctx.lineTo(canvas.width, canvas.height);
                ctx.fillStyle = 'rgba(0, 229, 255, 0.15)';
                ctx.fill();

                // Draw graph line
                ctx.beginPath(); ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = 2;
                for(let i=0; i<state.pingData.length; i++) {
                    const x = i * step;
                    const y = canvas.height - ((state.pingData[i] / 180) * canvas.height);
                    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                }
                ctx.stroke();
            }, 1000);

            const methods = ['GET', 'POST', 'WS'];
            const routes = ['/auth/verify', '/hwid/check', '/panel/sync', '/user/data', '/sys/heartbeat'];
            const logList = document.getElementById('api-log-list');
            
            state.apiInterval = setInterval(() => {
                if(Math.random() > 0.2) {
                    const m = methods[Math.floor(Math.random()*methods.length)];
                    const r = routes[Math.floor(Math.random()*routes.length)];
                    const t = new Date().toISOString().substring(11,19);
                    const isErr = Math.random() > 0.95;
                    const color = isErr ? 'text-red-400' : 'text-green-400';
                    const code = isErr ? (Math.random() > 0.5 ? '403' : '500') : '200';
                    const methodColor = m === 'GET' ? 'text-cyan-400' : (m === 'POST' ? 'text-yellow-400' : 'text-purple-400');
                    
                    const el = document.createElement('div');
                    el.className = 'border-b border-gray-800/50 pb-1 mb-1';
                    el.innerHTML = `<span class="text-gray-500">[${t}]</span> <span class="${methodColor} font-bold">${m}</span> ${r} <span class="${color} float-right font-bold drop-shadow-sm">${code}</span>`;
                    logList.prepend(el);
                    
                    if(logList.children.length > 20) logList.lastChild.remove();
                }
            }, 600);
        }
    </script>
